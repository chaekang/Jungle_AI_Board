name: Deploy to Lightsail

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-lightsail
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/nest-api/package-lock.json
            apps/web-react/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            apps/fastapi-api/requirements.txt
            apps/fastapi-api/requirements-dev.txt

      - name: Install dependencies
        run: |
          npm --prefix apps/nest-api ci
          npm --prefix apps/nest-api exec -- prisma generate --schema=apps/nest-api/prisma/schema.prisma
          npm --prefix apps/web-react ci
          python -m pip install -r apps/fastapi-api/requirements-dev.txt

      - name: Test
        run: npm test

      - name: Build applications
        run: npm run build

      - name: Validate production Compose configuration
        run: |
          NEST_ENV_FILE=.env.lightsail.example docker compose \
          --env-file .env.lightsail.example \
          -f docker-compose.yml \
          -f docker-compose.prod.yml \
          config --quiet

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Refuse stale deployment
        run: |
          latest_main_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$GITHUB_SHA" != "$latest_main_sha" ]]; then
            echo "Skipping stale revision $GITHUB_SHA; main is $latest_main_sha."
            exit 1
          fi

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lightsail
          chmod 600 ~/.ssh/lightsail
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Sync application files
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.env*' \
            --exclude='backups/' \
            --exclude='node_modules/' \
            --exclude='dist/' \
            --exclude='coverage/' \
            --exclude='.pytest_cache/' \
            --exclude='pytest-cache-files-*/' \
            -e 'ssh -i ~/.ssh/lightsail -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=3' \
            ./ "$LIGHTSAIL_USER@$LIGHTSAIL_HOST:/opt/jungle-ai-board/"

      - name: Build and restart services
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
        run: |
          ssh -i ~/.ssh/lightsail -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=3 "$LIGHTSAIL_USER@$LIGHTSAIL_HOST" <<'REMOTE'
            set -euo pipefail
            cd /opt/jungle-ai-board
            ./deploy/validate-production-env.sh .env.production
            export COMPOSE_PARALLEL_LIMIT=1
            available_mb="$(df -Pm . | awk 'NR == 2 {print $4}')"
            if (( available_mb < 4096 )); then
              docker builder prune -af --filter 'until=24h'
              docker image prune -af --filter 'until=168h'
              available_mb="$(df -Pm . | awk 'NR == 2 {print $4}')"
            fi
            if (( available_mb < 2048 )); then
              echo "Deployment aborted: only ${available_mb}MB of disk space is available." >&2
              exit 1
            fi

            mkdir -p backups
            if docker compose \
              --env-file .env.production \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              ps --status running --services | grep -qx postgres; then
              backup_file="backups/predeploy-$(date -u +%Y%m%dT%H%M%SZ).dump"
              docker compose \
                --env-file .env.production \
                -f docker-compose.yml \
                -f docker-compose.prod.yml \
                exec -T postgres sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc' \
                > "$backup_file"
              ls -1t backups/predeploy-*.dump | tail -n +4 | xargs -r rm --
            fi
            docker compose \
              --env-file .env.production \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              up -d --build --remove-orphans --wait --wait-timeout 300
            docker compose \
              --env-file .env.production \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
            docker compose \
              --env-file .env.production \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              ps
            curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
              http://127.0.0.1:8080/health
            curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
              http://127.0.0.1:8080/api/health
            docker image prune -f
            docker builder prune -f --filter 'until=168h'
          REMOTE

      - name: Verify public HTTPS endpoint
        env:
          LIGHTSAIL_DOMAIN: ${{ secrets.LIGHTSAIL_DOMAIN }}
        run: |
          curl --fail --show-error --silent \
            --connect-timeout 5 --max-time 15 \
            --retry 12 --retry-delay 5 --retry-all-errors \
            "https://$LIGHTSAIL_DOMAIN/health"
          curl --fail --show-error --silent \
            --connect-timeout 5 --max-time 15 \
            --retry 12 --retry-delay 5 --retry-all-errors \
            "https://$LIGHTSAIL_DOMAIN/api/health"
