services:
  nest-api:
    build:
      context: ./apps/nest-api
    env_file:
      - ${AWS_ENV_FILE:-.env.aws}
    environment:
      PORT: 3000
      NODE_ENV: production
      TRUST_PROXY_HOPS: 1
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3

  fastapi-api:
    build:
      context: ./apps/fastapi-api
    env_file:
      - ${AWS_ENV_FILE:-.env.aws}
    environment:
      NEST_API_BASE_URL: http://nest-api:3000
    ports:
      - "8000:8000"
    depends_on:
      nest-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3

  web-react:
    build:
      context: ./apps/web-react
      args:
        VITE_API_BASE_URL: ${PUBLIC_NEST_API_URL}
        VITE_AGENT_API_BASE_URL: ${PUBLIC_FASTAPI_API_URL}
    ports:
      - "8080:80"
    depends_on:
      - nest-api
      - fastapi-api
